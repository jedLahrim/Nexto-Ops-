name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop, production ]
  pull_request:
    branches: [ production ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Lint
      run: npm run lint

    - name: Run Unit Tests
      run: npm run test

    - name: Build
      run: npm run build

  deploy-to-aws:
    needs: build-and-test
    if: github.ref == 'refs/heads/production'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to AWS Lambda / ECS
        run: echo "Deploying to AWS..."
        # we Add AWS CLI or Serverless Framework deployment steps here
